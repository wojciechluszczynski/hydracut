name: Build and publish to live branch

# Hostinger's FTP endpoint for this account routes to a different node than the
# one serving hornetcut.pl, so FTP deploys never reach the docroot. Instead we
# build the static site and force-push the built output to the `live` branch;
# Hostinger's native Git deployment (hPanel -> Advanced -> GIT) runs on the web
# server and pulls `live` straight into public_html.

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Publikacja w Sanity woła to przez repository_dispatch, bo sama treść żyje
  # w CMS-ie, a strona jest statyczna i musi się przebudować, żeby ją pokazać.
  repository_dispatch:
    types: [sanity-publish]

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Force-push dist/ to the live branch
        run: |
          cd dist
          git init -q
          git config user.name "Wojciech Luszczynski"
          git config user.email "78645420+wojciechluszczynski@users.noreply.github.com"
          git checkout -q -b live
          git add -A
          git commit -q -m "Build ${GITHUB_SHA}"
          git push -f -q "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" live
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tell the server to pull the new build
        # Hostinger nie zaciaga galezi live sam, a wdrozenie przez FTP nie dociera
        # do katalogu strony. Pukamy wiec do odbiornika, ktory pobiera paczke
        # prosto z GitHuba. Repo jest publiczne, wiec serwer nie trzyma tokenu.
        run: |
          # Shared hosting potrafi nie odebrac polaczenia, wiec ponawiamy.
          kod=$(curl -sS -o /tmp/odp.json -w '%{http_code}' -X POST \
            --connect-timeout 20 --max-time 300 \
            --retry 5 --retry-delay 10 --retry-all-errors \
            -H "X-Wdrozenie-Klucz: $KLUCZ" "$URL")
          cat /tmp/odp.json; echo
          [ "$kod" = "200" ] || { echo "Odbiornik zwrocil $kod"; exit 1; }
        env:
          KLUCZ: ${{ secrets.WDROZENIE_KLUCZ }}
          URL: ${{ secrets.WDROZENIE_URL }}
